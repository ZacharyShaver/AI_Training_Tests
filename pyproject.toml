[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-training-tests"
version = "0.1.0"
description = "Dataset extraction and review tooling for dialogue training data."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pre-commit>=4.0.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "Training Data",
  "hermes_memory_vault",
  "review_outputs",
  "source_texts",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

