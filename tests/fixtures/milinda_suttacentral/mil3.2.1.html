          <h2>The Chariot Simile</h2>
          <p>King Milinda asked, “Is Nāgasena your permanent self?”</p>
          <p>Nāgasena said, “Just as ‘chariot’ is a conventional designation, so is ‘Nāgasena.’”</p>
